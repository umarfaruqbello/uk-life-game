<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK LIFE V10 - Goslife House</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#7cb36a;height:100vh;overflow:hidden}
#top{display:flex;gap:8px;padding:10px;position:absolute;top:0;left:0;right:0;z-index:10}
.pill{background:#fff;border-radius:20px;padding:10px 16px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.2);font-size:13px}
#money{flex:1;text-align:center}
#houseArea{position:absolute;top:56px;bottom:72px;left:0;right:0;display:grid;place-items:center}
#houseBox{width:96vw;max-width:520px;background:#000;border:3px solid #000;border-radius:18px;height:78vh;overflow:hidden;position:relative}
#houseImg{width:100%;height:100%;object-fit:cover}
#stats{position:absolute;top:8px;left:8px;right:8px;background:#ffffffe6;border-radius:12px;padding:8px 10px;display:flex;gap:10px;font-size:11px;font-weight:700;z-index:6}
#bottom{position:absolute;bottom:0;left:0;right:0;background:#fff;display:flex;gap:6px;padding:10px;overflow-x:auto}
#bottom button{flex:1;min-width:62px;padding:12px 5px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:800;font-size:11px}
#modal{position:absolute;inset:0;background:#0008;display:none;place-items:center;z-index:30}
#modal.open{display:grid}
#box{background:#fff;border-radius:20px;padding:18px;width:92%;max-width:400px;max-height:82vh;overflow:auto}
.job{border:1px solid #ddd;padding:10px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.job button{background:#00c853;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-weight:800}
#catalogueBtn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#00c853;color:#fff;border:none;border-radius:24px;padding:14px 26px;font-weight:900;z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#char{position:absolute;width:16px;height:24px;background:orange;border-radius:8px;border:2px solid #fff;left:20%;top:68%;z-index:8;transition:1s}
</style>
</head>
<body>
<div id="top">
<div class="pill" onclick="openM('build')">Buy mode</div>
<div class="pill" id="money">₦51,903,015</div>
<div class="pill">↻</div>
<div class="pill" onclick="location.reload()">✕</div>
</div>

<div id="houseArea">
<div id="houseBox">
<img id="houseImg" src="house.jpg">
<div id="stats"><span>Job: <b id="jobT">Barista</b></span><span>Skill: <b id="skillT">10%</b></span><span>Bank: ₦<b id="bankT">0</b></span></div>
<div id="char"></div>
<button id="catalogueBtn" onclick="openM('build')">⊞ Catalogue</button>
</div>
</div>

<div id="bottom">
<button onclick="work()">💼 WORK</button>
<button onclick="openM('jobs')">Jobs</button>
<button onclick="openM('bank')">Bank</button>
<button onclick="openM('houses')">Houses</button>
<button onclick="openM('cars')">Cars</button>
<button onclick="openM('map')">Tube</button>
<button onclick="openM('social')">Social</button>
</div>

<div id="modal"><div id="box"></div></div>

<script>
let s=JSON.parse(localStorage.getItem('ukv10')||'{"m":51903015,"job":"Barista","pay":5000,"skill":10,"bank":0,"car":"None","biz":"None"}');
function render(){
 document.getElementById('money').innerText='₦'+s.m.toLocaleString();
 document.getElementById('jobT').innerText=s.job;
 document.getElementById('skillT').innerText=s.skill+'%';
 document.getElementById('bankT').innerText=s.bank.toLocaleString();
 localStorage.setItem('ukv10',JSON.stringify(s));
}
function work(){s.m+=s.pay;if(s.biz!='None')s.m+=50000;document.getElementById('char').style.left=Math.random()*60+15+'%';render();}
function openM(type){
 const box=document.getElementById('box');let h='';
 if(type=='jobs'){h='<h3>Jobs</h3><button onclick="s.skill+=7;s.m-=10000;render()" style="width:100%;margin:8px 0;padding:12px;background:#222;color:#fff;border:none;border-radius:12px">📚 Study ₦10k +7%</button>';const jobs=[{n:'Barista',p:5000,sk:0},{n:'Driver',p:15000,sk:20},{n:'Software Dev',p:150000,sk:50},{n:'Doctor',p:500000,sk:80},{n:'CEO',p:1500000,sk:95}];jobs.forEach(j=>{h+=`<div class="job"><div>${j.n}<br><small>₦${j.p}/work | ${j.sk}%</small></div><button onclick="if(s.skill>=${j.sk}){s.job='${j.n}';s.pay=${j.p};render();}">Take</button></div>`});}
 if(type=='houses'){h='<h3>Houses</h3>';[{n:'Bedsit',p:0},{n:'Mushin',p:500000},{n:'Lekki Flat',p:5000000},{n:'Banana Island',p:25000000},{n:'Chelsea UK',p:50000000}].forEach(x=>{h+=`<div class="job"><div>${x.n}<br>₦${x.p.toLocaleString()}</div><button onclick="if(s.m>=${x.p}){s.m-=${x.p};render()}">Buy</button></div>`});}
 if(type=='cars'){h='<h3>Cars</h3>';[{n:'Keke',p:300000},{n:'Toyota',p:3000000},{n:'Range Rover',p:12000000}].forEach(x=>{h+=`<div class="job"><div>${x.n}<br>₦${x.p.toLocaleString()}</div><button onclick="if(s.m>=${x.p}){s.m-=${x.p};render()}">Buy</button></div>`});}
 if(type=='bank'){h=`<h3>Bank 5% interest</h3><p>₦${s.bank.toLocaleString()}</p><input id="dep" type="number" placeholder="Amount" style="width:100%;padding:12px;margin:10px 0;border-radius:12px;border:1px solid #ccc"><button onclick="let v=+document.getElementById('dep').value;if(s.m>=v){s.m-=v;s.bank+=v;render();}" style="width:48%;padding:12px;background:#00c853;color:#fff;border:none;border-radius:12px">Deposit</button><button onclick="let v=+document.getElementById('dep').value;if(s.bank>=v){s.bank-=v;s.m+=v;render();}" style="width:48%;padding:12px;background:#222;color:#fff;border:none;border-radius:12px">Withdraw</button><button onclick="s.bank=Math.floor(s.bank*1.05);render()" style="width:100%;margin-top:10px;padding:12px;background:gold;border:none;border-radius:12px;font-weight:800">Collect Interest</button>`}
 if(type=='map'){h='<h3>Transport</h3><div class="job"><div>Oshodi</div><button onclick="if(s.m>=500){s.m-=500;render()}">₦500</button></div><div class="job"><div>Lekki</div><button onclick="if(s.m>=1000){s.m-=1000;render()}">₦1000</button></div><div class="job"><div>Banana Island</div><button onclick="if(s.m>=2000){s.m-=2000;render()}">₦2000</button></div>'}
 if(type=='social'){h='<h3>Social + Business</h3><div class="job"><div>Shop Business ₦5M → ₦50k/WORK</div><button onclick="if(s.m>=5000000){s.m-=5000000;s.biz=\'Shop\';render();}">Buy</button></div><div class="job"><div>Club ₦20M → ₦200k/WORK</div><button onclick="if(s.m>=20000000){s.m-=20000000;s.biz=\'Club\';s.pay+=200000;render();}">Buy</button></div>'}
 if(type=='build'){h='<h3>Catalogue - Buy Mode</h3><p>Like your screenshot</p>';[{n:'Bed Upgrade',p:150000},{n:'Sofa Set',p:250000},{n:'TV 55',p:180000},{n:'Washing Machine',p:120000},{n:'Fridge',p:200000}].forEach(f=>{h+=`<div class="job"><div>${f.n}<br>₦${f.p.toLocaleString()}</div><button onclick="if(s.m>=${f.p}){s.m-=${f.p};render();alert('Placed!')}">Buy</button></div>`});}
 h+='<br><button onclick="closeM()" style="width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px">Close</button>';box.innerHTML=h;document.getElementById('modal').classList.add('open');
}
function closeM(){document.getElementById('modal').classList.remove('open')}
render();
</script>
</body>
</html>
