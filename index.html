`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK LIFE V2</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif}header{background:#1e293b;padding:12px;position:sticky;top:0}h1{text-align:center;font-size:18px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.bar{background:#334155;height:22px;border-radius:10px;position:relative;overflow:hidden}.fill{height:100%}.lbl{position:absolute;left:6px;top:2px;font-size:12px;font-weight:700}#money{text-align:center;font-size:22px;color:#22c55e;margin-top:8px;font-weight:900}#info{text-align:center;font-size:11px;color:#94a3b8}.wrap{max-width:600px;margin:auto;padding:10px;display:grid;gap:10px}.card{background:#1e293b;border-radius:12px;padding:10px;border:1px solid #334155}.btn{background:#0ea5e9;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:700;margin:3px;flex:1}.row{display:flex;flex-wrap:wrap}.item{display:flex;justify-content:space-between;background:#0f172a;padding:8px;border-radius:8px;margin:5px 0}.log{background:#020617;padding:8px;border-radius:8px;height:120px;overflow:auto;font-size:12px}</style></head><body><header><h1>🇬🇧 UK LIFE V2 - Like Lagos Life</h1><div class="bars"><div class="bar"><div id="hb" class="fill" style="width:80%;background:#22c55e"></div><div class="lbl">❤️ Health</div></div><div class="bar"><div id="hapb" class="fill" style="width:70%;background:#eab308"></div><div class="lbl">😊 Happy</div></div><div class="bar"><div id="kb" class="fill" style="width:40%;background:#38bdf8"></div><div class="lbl">🧠 Knowledge</div></div><div class="bar"><div id="vb" class="fill" style="width:20%;background:#a78bfa"></div><div class="lbl" id="vl">🛂 Student</div></div></div><div id="money">£ 1500</div><div id="info">Age 22 | Cleaner</div></header><div class="wrap"><div class="card"><b>🎲 Actions</b><div class="row"><button class="btn" onclick="work()">💼 Work</button><button class="btn" style="background:#16a34a" onclick="study()">📚 Study</button><button class="btn" style="background:#ea580c" onclick="sleep()">😴 Sleep</button><button class="btn" style="background:#7c3aed" onclick="evt()">🎁 Event</button></div></div><div class="card"><b>💼 UK Jobs (Need Knowledge)</b><div id="jobs"></div></div><div class="card"><b>🏠 Houses (Pay Rent)</b><div id="houses"></div></div><div class="card"><b>🚗 Cars</b><div id="cars"></div></div><div class="card"><b>📜 Life Log</b><div id="log" class="log">Welcome to UK! £1500 Student Visa. Work hard to get ILR & British Passport! Study to get better jobs!<br></div></div></div><script>let m=1500,h=80,ha=70,k=40,v=20,age=22,ji=0,hi=0,ci=0;let J=[["Cleaner",1200,0],["Rider",1800,20],["Care",2500,35],["IT Support",3800,50],["Nurse",5200,65],["Engineer",8000,80],["Doctor",12000,90]];let H=[["Shared Room Peckham",0,600],["Studio Croydon",8000,900],["1-Bed Stratford",25000,1300],["2-Bed Canary Wharf",75000,2000],["Mansion Chelsea",250000,0]];let C=[["Bus Oyster",0],["Bicycle",300],["Corsa",4000],["Tesla",35000],["Range Rover",80000]];let E=[["Cold Heating £200",-200,-5,-5,0,0],["Overtime +£400",400,0,5,0,0],["NHS free Health+10",0,10,0,0,0],["TfL fine -£80",-80,0,-10,0,0],["Scholarship Know+15",0,0,10,15,0],["Tax -£350",-350,0,0,0,0],["UKVI Visa+10",0,0,15,0,10]];function upd(){document.getElementById('money').innerText='£ '+m;document.getElementById('hb').style.width=h+'%';document.getElementById('hapb').style.width=ha+'%';document.getElementById('kb').style.width=k+'%';document.getElementById('vb').style.width=v+'%';let vn=v<30?'Student':v<60?'Skilled Worker':v<85?'ILR':'British Citizen';document.getElementById('vl').innerText='🛂 '+vn;document.getElementById('info').innerText='Age '+age.toFixed(1)+' | '+J[ji][0]+' | '+H[hi][0]+' | '+C[ci][0];render();}function lg(t){document.getElementById('log').innerHTML=t+'<br>'+document.getElementById('log').innerHTML;}function work(){let r=H[hi][2],p=J[ji][1];m+=p-r;h-=3;ha-=2;age+=0.2;lg('Work '+J[ji][0]+' +£'+p+' Rent -£'+r);chk();upd();if(v>=100&&hi>=3&&ji>=5){alert('🏆 YOU WIN UK LIFE V2! British Citizen!');}}function study(){if(m<100){lg('Need £100');return;}m-=100;k+=7;lg('Studied +7 Knowledge -£100');chk();upd();}function sleep(){h+=12;ha+=5;age+=0.2;lg('Slept +12 Health');chk();upd();}function evt(){let e=E[Math.floor(Math.random()*E.length)];m+=e[1];h+=e[2];ha+=e[3];k+=e[4];v+=e[5];lg(e[0]);chk();upd();}function chk(){h=Math.max(0,Math.min(100,h));ha=Math.max(0,Math.min(100,ha));k=Math.max(0,Math.min(100,k));v=Math.max(0,Math.min(100,v));}function render(){document.getElementById('jobs').innerHTML=J.map((j,i)=>`<div class=item><div><b> ${j[0]}</b><div style="font-size:10px">£${j}/m need ${j[2]}% ${i==ji?'✅':''}</div></div><button class=btn ${k<j[2]?'disabled':''} onclick="bj(${i})">Get</button></div>`).join('');document.getElementById('houses').innerHTML=H.map((j,i)=>`<div class=item><div><b> ${j[0]}</b><div style="font-size:10px">cost £${j} rent £${j[2]} ${i==hi?'✅':''}</div></div><button class=btn ${m<j[1]||i==hi?'disabled':''} onclick="bh(${i})">Buy</button></div>`).join('');document.getElementById('cars').innerHTML=C.map((j,i)=>`<div class=item><div><b> ${j[0]}</b><div style="font-size:10px">£${j} ${i==ci?'✅':''}</div></div><button class=btn ${m<j||i==ci?'disabled':''} onclick="bc(${i})">Buy</button></div>`).join('');}function bj(i){if(k>=J[i][2]){ji=i;lg('New job '+J[i][0]+'!');upd();}}function bh(i){if(m>=H[i][1]){m-=H[i][1];hi=i;ha+=10;lg('Moved to '+H[i][0]);upd();}}function bc(i){if(m>=C[i][1]){m-=C[i][1];ci=i;ha+=10;lg('Got '+C[i][0]);upd();}}upd();</script></body></html>`[1]
