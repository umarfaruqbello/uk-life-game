<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK LIFE V5 3D</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#081a33;color:#fff;min-height:100vh;display:flex;flex-direction:column}.top{background:#fff;color:#111;border-radius:30px;margin:8px 10px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:800}.pill-row{display:flex;gap:8px;margin:0 10px 8px;overflow:auto}.pill{background:#fff;color:#111;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700}.scene{flex:1;margin:0 10px;background:radial-gradient(#1a3a6a,#081a33);border-radius:20px;display:flex;align-items:center;justify-content:center;perspective:900px;overflow:hidden;min-height:360px;position:relative}.cube{width:200px;height:200px;position:relative;transform-style:preserve-3d;transition:0.8s cubic-bezier(.2,.8,.2,1)}.face{position:absolute;width:200px;height:200px;border:2px solid #ffffff22;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:14px}.front{transform:translateZ(100px);background:linear-gradient(#3d5a80,#2a4a70)}.back{transform:rotateY(180deg) translateZ(100px);background:linear-gradient(#6b8cae,#4a6a8e)}.right{transform:rotateY(90deg) translateZ(100px);background:linear-gradient(#a8c3d9,#8ab);color:#111}.left{transform:rotateY(-90deg) translateZ(100px);background:linear-gradient(#d9e6f0,#b9c6d0);color:#111}.topf{transform:rotateX(90deg) translateZ(100px);background:#12264f;opacity:.8}.bottom{transform:rotateX(-90deg) translateZ(100px);background:repeating-linear-gradient(45deg,#8b5a2b,#8b5a2b 10px,#a67c52 10px,#a67c52 20px)}.furn{font-size:28px;margin-bottom:4px}.arrow{position:absolute;top:50%;transform:translateY(-50%);background:#fff;color:#111;border:0;width:44px;height:44px;border-radius:50%;font-weight:900;font-size:22px;z-index:10;box-shadow:0 4px 12px #0005}.al{left:10px}.ar{right:10px}.work-bar{background:#fff;margin:8px 10px;border-radius:16px;padding:10px;display:flex;gap:8px;color:#111}.wbtn{flex:1;background:#4caf50;color:#fff;border:0;padding:12px;border-radius:12px;font-weight:800}.hud{margin:0 10px 8px;display:flex;gap:8px}.stats{background:#fff;border-radius:16px;padding:8px;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px}.bar{height:6px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%}.nav{background:#fff;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;padding:10px 0}.nb{flex:1;background:none;border:0;font-size:11px;font-weight:800;color:#777}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:99}.modal.show{display:flex}.sheet{width:100%;max-width:440px;max-height:90vh;background:#f2f2f2;color:#111;border-radius:28px 28px 0 0;padding:14px;overflow:auto}.btn{background:#0ea5e9;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:800}</style></head><body><div class="top"><span id="clk">7:39 AM</span><span>📍<span id="locn">Peckham</span></span><span id="mt">£1500</span></div><div class="pill-row"><div class="pill">👤 1 player (You)</div><div class="pill" style="background:#d1fae5">🟢 Online: Just You</div><div class="pill" onclick="openMap()">🗺️ Map</div></div><div class="scene" id="scene"><div class="cube" id="cube"><div class="face front"><div class="furn">🛋️📺</div>Lounge<div style="font-size:10px">Sofa + TV + Rug</div></div><div class="face right"><div class="furn">🛏️💡</div>Bedroom<div style="font-size:10px">Bed + Lamp + Wardrobe</div></div><div class="face back"><div class="furn">🍳🔪</div>Kitchen<div style="font-size:10px">Fridge + Cooker + Table</div></div><div class="face left"><div class="furn">🚿🧼</div>Bath<div style="font-size:10px">Shower + Toilet + Sink</div></div><div class="face topf">CEILING</div><div class="face bottom">WOOD FLOOR</div></div><button class="arrow al" onclick="rot(-1)">‹</button><button class="arrow ar" onclick="rot(1)">›</button><div style="position:absolute;bottom:8px;left:10px;right:10px;background:#000a;color:#fff;padding:6px 12px;border-radius:12px;font-size:11px;display:flex;justify-content:space-between"><span>🏠 <span id="hname">Peckham 3D House</span></span><span id="rname">Lounge - Drag to rotate</span></div></div><div class="work-bar"><button class="wbtn" onclick="work()">💷 WORK +£<span id="earn">600</span></button><button class="wbtn" style="background:#ff9800" onclick="openMap()">🗺️ MAP</button><button class="wbtn" style="background:#2196f3" onclick="openPhone()">📱 JOBS</button></div><div class="hud"><div style="width:48px;height:48px;border-radius:50%;background:#ffca28;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid #4caf50">🧑‍💼</div><div class="stats"><div>🍔<div class="bar"><div class="fill" id="f1" style="width:80%;background:#ff9800"></div></div></div><div>⚡<div class="bar"><div class="fill" id="f2" style="width:70%;background:#ffeb3b"></div></div></div><div>🎉<div class="bar"><div class="fill" id="f3" style="width:60%;background:#e91e63"></div></div></div><div>💬<div class="bar"><div class="fill" id="f4" style="width:50%;background:#4caf50"></div></div></div></div><div style="background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center" onclick="location.reload()">🔄</div></div><div class="nav"><button class="nb">🏠 3D Home</button><button class="nb" onclick="openMap()">🗺️ Map</button><button class="nb" onclick="openPhone()">💼 Jobs</button><button class="nb" onclick="daily()">💎 Daily</button></div><div class="modal" id="mapM"><div class="sheet"><div style="display:flex;justify-content:space-between"><b>UK MAP</b><button class="btn" onclick="closeMap()">X</button></div><div id="locList" style="margin-top:10px"></div></div></div><div class="modal" id="phoneM"><div class="sheet"><div style="display:flex;justify-content:space-between"><b>Jobs & Houses</b><button class="btn" onclick="closePhone()">X</button></div><div id="panel"></div></div></div><script>var m=1500,hu=80,en=70,fu=20,curR=0,curL=0,ji=0,hi=0,ang=0;var RN=["Lounge","Bedroom","Kitchen","Bath"];var J=[["Cleaner",1200,0],["Rider",1800,20],["Care",2500,35],["IT",3800,50],["Nurse",5200,65],["Engineer",8000,80],["Doctor",12000,90]];var H=[["Shared Peckham",0,600],["Studio Croydon",8000,900],["1-Bed Stratford",25000,1300],["2-Bed Canary",75000,2000],["Mansion Chelsea",250000,0]];var L=[["Peckham",0],["Croydon",5],["Stratford",10],["Canary Wharf",15],["Chelsea",20]];function rot(d){ang+=d*90;curR=(curR+d+4)%4;document.getElementById("cube").style.transform="rotateY("+ang+"deg)";document.getElementById("rname").innerText=RN[curR]+" - "+(curR==1?"Energy +":curR==2?"Hunger +":curR==3?"Hygiene +":"Tap arrows");if(curR==1)en=Math.min(100,en+5);if(curR==2)hu=Math.min(100,hu+10);if(curR==3)hu=Math.min(100,hu+5);upd()}function openMap(){var s="";for(var i=0;i<L.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd"><div><b>'+L[i][0]+'</b><br><small>'+(i==curL?'YOU ARE HERE':'Travel £'+L[i][1])+'</small></div><button class="btn" onclick="travel('+i+')">Go</button></div>'}document.getElementById("locList").innerHTML=s;document.getElementById("mapM").classList.add("show")}function closeMap(){document.getElementById("mapM").classList.remove("show")}function openPhone(){var s='<b>Jobs Knowledge '+fu+'%</b>';for(var i=0;i<J.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>'+J[i][0]+' £'+J[i][1]+'</b><br><small>Need '+J[i][2]+'% '+(i==ji?'✅':'')+'</small></div><button class="btn" onclick="takeJ('+i+')">Take</button></div>'}s+='<br><b>Houses</b>';for(var i=0;i<H.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>'+H[i][0]+' £'+H[i][1]+'</b><br><small>Rent £'+H[i][2]+'</small></div><button class="btn" onclick="buyH('+i+')">Buy</button></div>'}s+='<br><div style="background:#fff;padding:10px;border-radius:12px">Study £100 +7%<br><button class="btn" style="margin-top:6px" onclick="study()">Study</button></div>';document.getElementById("panel").innerHTML=s;document.getElementById("phoneM").classList.add("show")}function closePhone(){document.getElementById("phoneM").classList.remove("show")}function travel(i){if(m<L[i][1]){alert("Need £"+L[i][1]);return}m-=L[i][1];curL=i;document.getElementById("locn").innerText=L[i][0];closeMap();upd()}function takeJ(i){if(fu>=J[i][2]){ji=i;upd();openPhone()}}function buyH(i){if(m>=H[i][1]){m-=H[i][1];hi=i;document.getElementById("hname").innerText=H[i][0];upd();openPhone()}}function work(){var e=J[ji][1]-H[hi][2];if(e<100)e=100;m+=e;hu=Math.max(0,hu-3);en=Math.max(0,en-4);upd()}function study(){if(m<100)return;m-=100;fu=Math.min(100,fu+7);upd();openPhone()}function daily(){m+=30;upd()}function upd(){document.getElementById("mt").innerText="£"+m;document.getElementById("f1").style.width=hu+"%";document.getElementById("f2").style.width=en+"%";document.getElementById("f3").style.width=fu+"%";document.getElementById("earn").innerText=J[ji][1]-H[hi][2];try{localStorage.setItem("ukv5",JSON.stringify({m:m,hu:hu,en:en,fu:fu,ji:ji,hi:hi,curL:curL}))}catch(e){}}try{var s=JSON.parse(localStorage.getItem("ukv5")||"null");if(s){m=s.m||1500;hu=s.hu||80;en=s.en||70;fu=s.fu||20;ji=s.ji||0;hi=s.hi||0;curL=s.curL||0}}catch(e){}var sc=document.getElementById("scene");var sx=0;sc.addEventListener("touchstart",function(e){sx=e.touches[0].clientX});sc.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(dx>50)rot(-1);if(dx<-50)rot(1)});setInterval(function(){document.getElementById("clk").innerText=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})},1000);upd();document.getElementById("cube").style.transform="rotateY(0deg)"</script></body></html>
