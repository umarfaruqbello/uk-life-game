<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UK LIFE V8.1</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#081a33;color:#fff;min-height:100vh;display:flex;flex-direction:column}.top{background:#fff;color:#111;border-radius:28px;margin:8px 10px;padding:12px;display:flex;justify-content:space-between;font-weight:900}.scene{flex:1;margin:0 10px;background:radial-gradient(#1e3a66,#081a33);border-radius:20px;display:flex;align-items:center;justify-content:center;perspective:900px;min-height:340px;position:relative}.cube{width:180px;height:180px;position:relative;transform-style:preserve-3d;transition:.7s}.face{position:absolute;width:180px;height:180px;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.front{transform:translateZ(90px);background:#3d5a80}.back{transform:rotateY(180deg) translateZ(90px);background:#6b8cae}.right{transform:rotateY(90deg) translateZ(90px);background:#a8c3d9;color:#111}.left{transform:rotateY(-90deg) translateZ(90px);background:#e6eef5;color:#111}.arrow{position:absolute;top:50%;background:#fff;color:#111;border:0;width:40px;height:40px;border-radius:50%;font-weight:900;z-index:5}.al{left:10px}.ar{right:10px}.bar{background:#fff;margin:8px 10px;border-radius:14px;padding:10px;display:flex;gap:6px}.b{flex:1;background:#4caf50;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:900}.nav{background:#fff;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;padding:10px 0}.n{flex:1;background:none;border:0;font-size:11px;font-weight:900;color:#777}.m{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:99}.m.show{display:flex}.s{width:100%;max-width:440px;max-height:90vh;background:#f2f2f2;color:#111;border-radius:28px 28px 0 0;padding:14px;overflow:auto}.btn{background:#111;color:#fff;border:0;padding:8px 12px;border-radius:8px;font-weight:800}.fly{position:fixed;left:50%;top:60%;background:#16a34a;color:#fff;padding:10px 18px;border-radius:20px;font-weight:900;z-index:200;animation:f 1s forwards}@keyframes f{to{transform:translate(-50%,-150%);opacity:0}}</style></head><body><div class="top"><span id="c">7:39 AM</span><span id="loc">Peckham</span><span id="mt">£1500</span></div><div class="scene" id="sc"><div class="cube" id="cb"><div class="face front">🛋️<br>Lounge</div><div class="face right">🛏️<br>Bedroom</div><div class="face back">🍳<br>Kitchen</div><div class="face left">🚿<br>Bath</div></div><button class="arrow al" onclick="ro(-1)">‹</button><button class="arrow ar" onclick="ro(1)">›</button></div><div class="bar"><button class="b" onclick="wk()">💷 WORK +£<span id="er">600</span></button><button class="b" style="background:#ff9800" onclick="om()">🗺️ MAP</button><button class="b" style="background:#2196f3" onclick="op()">📱 PHONE</button></div><div class="nav"><button class="n">🏠 Home</button><button class="n" onclick="om()">🗺️ Map</button><button class="n" onclick="op()">📱 Phone</button><button class="n" onclick="dl()">💎 Daily</button></div><div class="m" id="mm"><div class="s"><div style="display:flex;justify-content:space-between"><b>UK MAP</b><button class="btn" onclick="cm()">X</button></div><div id="ll"></div></div></div><div class="m" id="pm"><div class="s"><div style="display:flex;justify-content:space-between"><b>Phone - Lagos Life Style</b><button class="btn" onclick="cp()">X</button></div><div id="pn"></div></div></div><script>var m=1500,sk=20,ji=0,hi=0,ci=-1,curL=0,ang=0,curR=0;var J=[["Cleaner",1200,0],["Rider",1800,20],["Care",2500,35],["IT",3800,50],["Nurse",5200,65],["Engineer",8000,80],["Doctor",12000,90]];var H=[["Shared Peckham",0,600],["Studio Croydon",8000,900],["Stratford",25000,1300],["Canary",75000,2000],["Chelsea",250000,0]];var C=[["Corsa",3000],["Golf",12000],["BMW",28000],["Tesla",55000],["Range Rover",120000]];var L=[["Peckham",0],["Croydon",5],["Stratford",10],["Canary",15],["Chelsea",20]];function ro(d){ang+=d*90;curR=(curR+d+4)%4;document.getElementById("cb").style.transform="rotateY("+ang+"deg)"}function om(){var s="";for(var i=0;i<L.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd"><div><b>'+L[i][0]+' £'+L[i][1]+'</b></div><button class="btn" onclick="tr('+i+')">Go</button></div>'}document.getElementById("ll").innerHTML=s;document.getElementById("mm").classList.add("show")}function cm(){document.getElementById("mm").classList.remove("show")}function op(){var s='<b>Jobs Skill '+sk+'%</b><br>';for(var i=0;i<J.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>'+J[i][0]+' £'+J[i][1]+'</b></div><button class="btn" onclick="tj('+i+')">Take</button></div>'}s+='<br><b>Houses</b><br>';for(var i=0;i<H.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>'+H[i][0]+' £'+H[i][1]+'</b></div><button class="btn" onclick="bh('+i+')">Buy</button></div>'}s+='<br><b>Cars</b><br>';for(var i=0;i<C.length;i++){s+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd"><div><b>'+C[i][0]+' £'+C[i][1]+'</b></div><button class="btn" onclick="bc('+i+')">Buy</button></div>'}s+='<br><div style="background:#fff;padding:10px;border-radius:12px">Study £100 +7% Skill<br><button class="btn" style="margin-top:6px" onclick="st()">Study</button></div><br><div style="background:#111;color:#fff;padding:10px;border-radius:12px">Bank £'+m+'<br><button class="btn" style="background:#fff;color:#111;margin-top:6px" onclick="dl()">Daily +£30</button></div>';document.getElementById("pn").innerHTML=s;document.getElementById("pm").classList.add("show")}function cp(){document.getElementById("pm").classList.remove("show")}function tr(i){if(m<L[i][1]){alert("Need £"+L[i][1]);return}m-=L[i][1];curL=i;document.getElementById("loc").innerText=L[i][0];cm();up();fly("-£"+L[i][1])}function tj(i){if(sk>=J[i][2]){ji=i;up();op();fly("Job: "+J[i][0])}}function bh(i){if(m>=H[i][1]){m-=H[i][1];hi=i;up();op();fly("House bought")}}function bc(i){if(m>=C[i][1]){m-=C[i][1];ci=i;up();op();fly(C[i][0])}}function wk(){var e=J[ji][1]-H[hi][2];if(e<100)e=100;m+=e;up();fly("+£"+e)}function st(){if(m<100)return;m-=100;sk=Math.min(100,sk+7);up();op();fly("+7% Skill")}function dl(){m+=30;up();fly("+£30")}function fly(t){var d=document.createElement("div");d.className="fly";d.innerText=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1000)}function up(){document.getElementById("mt").innerText="£"+m;document.getElementById("er").innerText=J[ji][1]-H[hi][2];localStorage.setItem("uk81",JSON.stringify({m:m,sk:sk,ji:ji,hi:hi,ci:ci,curL:curL}))}try{var s=JSON.parse(localStorage.getItem("uk81")||"null");if(s){m=s.m||1500;sk=s.sk||20;ji=s.ji||0;hi=s.hi||0;ci=s.ci||-1;curL=s.curL||0;if(L[curL])document.getElementById("loc").innerText=L[curL][0]}}catch(e){}setInterval(function(){document.getElementById("c").innerText=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})},1000);up();var sc=document.getElementById("sc"),sx=0;sc.addEventListener("touchstart",function(e){sx=e.touches[0].clientX});sc.addEventListener("touchend",function(e){var dx=e.changedTouches[0].clientX-sx;if(dx>40)ro(-1);if(dx<-40)ro(1)});</script></body></html>
